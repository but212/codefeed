[package]
name = "codefeed"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI that converts local directories or GitHub repositories into LLM-friendly digests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/but212/codefeed"
readme = "README.md"
keywords = ["llm", "digest", "codebase", "prompt", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "context.md"]

[dependencies]
ignore = "0.4" # .gitignore rule matching without invoking git
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] } # Minimal synchronous HTTP client for GitHub tarball streams
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] } # Gzip decompression for GitHub archive streams
tar = "0.4" # Tarball entry streaming without temporary disk extraction
zeroize = "1" # Secure clearing of GitHub authorization tokens from process memory
memchr = "2" # SIMD-accelerated byte searching for delimiters, NUL byte detection, and fast path scanning


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "codefeed"
bench = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
incremental = true
panic = "abort"
debug = "full"
split-debuginfo = "packed"
strip = "symbols"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] } # Deterministic property tests for core invariants
