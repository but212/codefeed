[package]
name = "codefeed"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI that converts local directories or GitHub repositories into LLM-friendly digests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/but212/codefeed"
readme = "README.md"
keywords = ["llm", "digest", "codebase", "prompt", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "context.md"]

[dependencies]
ignore = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
flate2 = "1.0"
tar = "0.4"
percent-encoding = "2.3"
memchr = "2.8"
log = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs"] }

[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "codefeed"
bench = false

[[bench]]
name = "bench"
harness = false
