[package]
name = "codefeed"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI that converts local directories or GitHub repositories into LLM-friendly digests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/but212/codefeed"
readme = "README.md"
keywords = ["llm", "digest", "codebase", "prompt", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "context.md"]

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
flate2 = "1.0"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
