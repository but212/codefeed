[package]
name = "codefeed"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI that converts local directories or GitHub repositories into LLM-friendly digests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/but212/codefeed"
readme = "README.md"
keywords = ["llm", "digest", "codebase", "prompt", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "context.md"]

[dependencies]
ignore = "0.4" # Fast .gitignore parsing and deterministic directory traversal without invoking git
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] } # Minimal synchronous HTTP client for GitHub tarball streams
flate2 = "1.0" # Gzip decompression for GitHub archive streams
tar = "0.4" # Tarball entry streaming without temporary disk extraction


[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "codefeed"
bench = false
