[package]
name = "rustingest"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
