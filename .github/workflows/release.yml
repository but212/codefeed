name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Dry-run: runs gate and 6-target build without publishing

permissions:
  contents: read

env:
  RELEASE_DOCS: README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE

jobs:
  gate:
    name: Verify Tag and Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Verify tag matches Cargo.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($MANIFEST_VERSION)"
            exit 1
          fi
          awk -v ver="$TAG_VERSION" '
            BEGIN {
              target1 = ver
              target2 = "[" ver "]"
            }
            /^## / {
              if ($1 == "##" && ($2 == target1 || $2 == target2)) {
                flag = 1
                next
              } else if (flag) {
                exit
              }
            }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "Error: CHANGELOG.md does not contain a non-empty entry for version $TAG_VERSION"
            exit 1
          fi

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Run test suite
        run: cargo test --lib --bins --tests --locked

      - name: Run doc tests
        run: cargo test --doc --locked

      - name: Verify crates.io packaging
        run: cargo publish --dry-run --locked

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --locked

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: codefeed
            archive_ext: tgz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: codefeed
            archive_ext: tgz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            artifact_name: codefeed
            archive_ext: tgz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: codefeed
            archive_ext: tgz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: codefeed
            archive_ext: tgz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: codefeed.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache: "false"

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Set archive ref
        id: meta
        shell: bash
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Package release assets (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          cp $RELEASE_DOCS staging/
          tar -czvf "codefeed-${{ steps.meta.outputs.ref }}-${{ matrix.target }}.${{ matrix.archive_ext }}" -C staging .

      - name: Package release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -Destination staging/
          Copy-Item ($env:RELEASE_DOCS -split ' ') -Destination staging/
          Compress-Archive -Path (Get-ChildItem -Force staging).FullName -DestinationPath "codefeed-${{ steps.meta.outputs.ref }}-${{ matrix.target }}.${{ matrix.archive_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codefeed-${{ matrix.target }}
          path: codefeed-${{ steps.meta.outputs.ref }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Download all built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codefeed-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: (cd dist && sha256sum *.tgz *.zip > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
